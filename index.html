<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>HealthConnect Perú | Telemedicina Inteligente</title>
  
  <!-- Font Awesome para iconos médicos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --azul-medico: #0b3d5f;
      --verde-salud: #2a9d8f;
      --purpura-tech: #5f4b8b;
      --gris-fondo: #f0f4f8;
      --blanco: #ffffff;
      --sombra-tarjeta: 0 20px 35px rgba(0, 20, 30, 0.15);
      --borde-redondeado: 2rem;
      --transicion-general: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
    }

    body {
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #d4e7f5 0%, #b8d9ec 40%, #c5e0d5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
      margin: 0;
      animation: entradaSuave 0.6s ease-out;
    }

    @keyframes entradaSuave {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .tarjeta-health {
      max-width: 800px;
      width: 100%;
      background: #ffffff;
      border-radius: var(--borde-redondeado);
      box-shadow: var(--sombra-tarjeta), 0 0 0 1px rgba(42, 157, 143, 0.2);
      padding: 1.8rem 1.5rem 2rem;
      transition: var(--transicion-general);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .area-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 2rem;
      font-weight: 700;
      color: var(--azul-medico);
      letter-spacing: -0.5px;
    }

    .icono-logo {
      background: linear-gradient(135deg, var(--verde-salud), var(--purpura-tech));
      color: white;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 8px 18px rgba(42, 157, 143, 0.4);
      animation: pulsoSuave 2.2s infinite;
    }

    @keyframes pulsoSuave {
      0% { transform: scale(1); box-shadow: 0 8px 18px rgba(42, 157, 143, 0.3); }
      50% { transform: scale(1.06); box-shadow: 0 12px 24px rgba(94, 75, 139, 0.45); }
      100% { transform: scale(1); box-shadow: 0 8px 18px rgba(42, 157, 143, 0.3); }
    }

    .selector-roles {
      display: flex;
      background: #e9f0f5;
      border-radius: 3rem;
      padding: 0.3rem;
      gap: 0.3rem;
      margin: 0.2rem 0 0.5rem;
    }

    .boton-rol {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0.8rem 0.5rem;
      border-radius: 2.5rem;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: var(--transicion-general);
      color: #2c3e50;
      background: transparent;
    }

    .boton-rol.activo {
      background: white;
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
      color: var(--azul-medico);
      font-weight: 700;
      transform: scale(1.02);
    }

    .boton-rol i {
      font-size: 1.1rem;
    }

    .contenedor-vista {
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 1;
      transform: translateY(0);
    }

    .contenedor-vista.transicion-desvanecer {
      opacity: 0;
      transform: translateY(12px);
    }

    .caja-autenticacion {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .grupo-entrada {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .etiqueta {
      font-weight: 600;
      color: #1e4a5f;
      font-size: 0.9rem;
      margin-left: 0.3rem;
    }

    .campo-texto, .area-texto {
      padding: 0.9rem 1rem;
      border: 1px solid #dce7f0;
      border-radius: 1.5rem;
      font-size: 0.95rem;
      background: #f9fcff;
      transition: var(--transicion-general);
      outline: none;
    }

    .campo-texto:focus, .area-texto:focus {
      border-color: var(--verde-salud);
      box-shadow: 0 0 0 3px rgba(42,157,143,0.2);
    }

    .boton-principal {
      background: var(--azul-medico);
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.9rem;
      border-radius: 2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transicion-general);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      background: linear-gradient(135deg, #0b3d5f, #1b5a82);
      box-shadow: 0 8px 18px rgba(11,61,95,0.25);
    }

    .boton-principal:hover {
      transform: scale(1.02);
      background: linear-gradient(135deg, #134b6e, #226b94);
    }

    .boton-secundario {
      background: transparent;
      border: 1.5px solid var(--azul-medico);
      color: var(--azul-medico);
      box-shadow: none;
      background: white;
    }

    .boton-secundario:hover {
      background: #f0f7fe;
    }

    .boton-pequeno {
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
    }

    .lista-pacientes {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .tarjeta-paciente {
      background: #f4f9ff;
      border-radius: 1.2rem;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #d9e9fa;
      transition: var(--transicion-general);
      cursor: pointer;
    }

    .tarjeta-paciente:hover {
      background: #e3f1ff;
      transform: scale(1.01);
      box-shadow: 0 6px 14px rgba(0,0,0,0.05);
    }

    .resumen-clinico {
      background: #fff9f0;
      border-radius: 1rem;
      padding: 0.9rem;
      margin: 0.5rem 0;
      font-size: 0.85rem;
      border-left: 4px solid var(--verde-salud);
    }

    /* ========== ESTILOS PARA EL CONTENEDOR DEL CHATBOT ========== */
    .info-paciente {
      background: linear-gradient(135deg, #e3f2fd, #e8eaf6);
      padding: 0.8rem 1rem;
      border-radius: 1rem;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      border: 1px solid #bbdefb;
    }

    .info-doctor {
      background: linear-gradient(135deg, #e8f5e9, #e0f2f1);
      padding: 0.8rem 1rem;
      border-radius: 1rem;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      border: 1px solid #a5d6a7;
      color: #1b5e20;
    }

    .contenedor-chatbot {
      width: 100%;
      border-radius: 1.5rem;
      overflow: hidden;
      border: 2px solid var(--verde-salud);
      box-shadow: 0 8px 25px rgba(42, 157, 143, 0.2);
      background: white;
      margin-top: 0.5rem;
    }

    .contenedor-chatbot iframe {
      width: 100%;
      height: 100%;
      min-height: 600px;
      border: none;
      display: block;
    }

    /* Loader mientras carga el iframe */
    .cargando-chatbot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 600px;
      gap: 1rem;
      color: var(--azul-medico);
      background: #f8fafc;
    }

    .cargando-chatbot .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #e0e8f0;
      border-top: 4px solid var(--verde-salud);
      border-radius: 50%;
      animation: girar 1s linear infinite;
    }

    @keyframes girar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .barra-navegacion {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.3rem;
    }

    .pestana {
      padding: 0.6rem 1.2rem;
      border-radius: 1.5rem;
      border: 1px solid #dce7f0;
      background: white;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: #5a6d7e;
      transition: var(--transicion-general);
    }

    .pestana.activa {
      background: var(--azul-medico);
      color: white;
      border-color: var(--azul-medico);
    }

    .pestana:hover {
      border-color: var(--verde-salud);
      color: var(--azul-medico);
    }

    .pestana.activa:hover {
      color: white;
    }

    .mensaje-bienvenida {
      text-align: center;
      padding: 1.5rem;
      background: #f0f7ff;
      border-radius: 1rem;
      margin-bottom: 0.5rem;
    }

    hr {
      border: 0.5px solid #d0e0ef;
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
<div class="tarjeta-health" id="tarjetaPrincipal">
  <div class="area-logo">
    <div class="icono-logo"><i class="fas fa-heartbeat"></i></div>
    <span>HealthConnect Perú</span>
  </div>

  <div class="selector-roles" id="selectorRoles">
    <button class="boton-rol activo" data-rol="paciente"><i class="fas fa-user"></i> PACIENTE</button>
    <button class="boton-rol" data-rol="doctor"><i class="fas fa-user-md"></i> DOCTOR</button>
  </div>

  <div id="vistaDinamica" class="contenedor-vista"></div>
</div>

<script>
  (function() {
    // ========== CONFIGURACIÓN DE CHATBASE ==========
    const CONFIG_CHATBASE = {
      agentId: '4d52QO1FUm5j4Lkj_zwEd',
      iframeUrl: 'https://www.chatbase.co/chatbot-iframe/4d52QO1FUm5j4Lkj_zwEd'
    };

    // ========== BASE DE DATOS SIMULADA ==========
    const BASE_PACIENTES = {
      "juan.perez@gmail.com": {
        id: "PAC001",
        nombre: "Juan Pérez",
        edad: 45,
        medicamentos: "Losartán 50mg cada 12 horas",
        laboratorio: "Hemoglobina 14.2 g/dL, Glucosa 110 mg/dL",
        proximaCita: "15 de agosto 2026 - 10:30 am",
        alergias: "Ninguna",
        codigoVerificacion: "482931",
        diagnostico: "Hipertensión arterial controlada",
        recomendaciones: "Dieta baja en sodio, ejercicio 3 veces por semana"
      },
      "maria.lopez@email.com": {
        id: "PAC002",
        nombre: "María López",
        edad: 58,
        medicamentos: "Amlodipino 5mg cada 24 horas, Atorvastatina 20mg noche",
        laboratorio: "Colesterol total 220 mg/dL, LDL 140, HDL 45",
        proximaCita: "22 de agosto 2026 - 09:15 am",
        alergias: "Penicilina",
        codigoVerificacion: "759201",
        diagnostico: "Hipertensión + Hipercolesterolemia",
        recomendaciones: "Dieta mediterránea, caminata diaria 30 min"
      },
      "carlos.ruiz@salud.pe": {
        id: "PAC003",
        nombre: "Carlos Ruiz",
        edad: 32,
        medicamentos: "Ibuprofeno 400mg según dolor (máx 3/día)",
        laboratorio: "Hemograma normal, PCR bajo, Radiografía normal",
        proximaCita: "05 de setiembre 2026 - 11:00 am",
        alergias: "Ninguna",
        codigoVerificacion: "104832",
        diagnostico: "Lumbalgia mecánica",
        recomendaciones: "Fisioterapia, evitar cargar peso, ejercicios de estiramiento"
      }
    };

    const BASE_DOCTORES = {
      "doctor@healthconnect.pe": {
        id: "DOC001",
        nombre: "Dra. Katherine Espinoza",
        especialidad: "Medicina Interna",
        contrasena: "med2026",
        pacientes: ["PAC001", "PAC002", "PAC003"]
      }
    };

    // ========== ESTADO GLOBAL ==========
    let rolActual = 'paciente';
    let estadoAutenticacion = {
      pacienteConectado: false,
      correoPaciente: null,
      datosPaciente: null,
      doctorConectado: false,
      correoDoctor: null,
      datosDoctor: null
    };
    let pacienteSeleccionadoDoctor = null;
    let pestanaActiva = 'chatbot'; // 'chatbot' o 'historial'

    const vistaDinamica = document.getElementById('vistaDinamica');
    const botonesRol = document.querySelectorAll('.boton-rol');

    // ========== FUNCIONES PRINCIPALES ==========
    
    function aplicarTransicionDesvanecer() {
      vistaDinamica.classList.add('transicion-desvanecer');
      setTimeout(() => {
        vistaDinamica.classList.remove('transicion-desvanecer');
      }, 50);
    }

    function cambiarRol(nuevoRol) {
      if (rolActual === nuevoRol) return;
      rolActual = nuevoRol;
      
      // Resetear todo el estado
      estadoAutenticacion.pacienteConectado = false;
      estadoAutenticacion.correoPaciente = null;
      estadoAutenticacion.datosPaciente = null;
      estadoAutenticacion.doctorConectado = false;
      estadoAutenticacion.correoDoctor = null;
      estadoAutenticacion.datosDoctor = null;
      pacienteSeleccionadoDoctor = null;
      pestanaActiva = 'chatbot';
      
      botonesRol.forEach(boton => {
        const rolBoton = boton.getAttribute('data-rol');
        boton.classList.toggle('activo', rolBoton === nuevoRol);
      });
      
      aplicarTransicionDesvanecer();
      renderizarVista();
    }

    function renderizarVista() {
      if (rolActual === 'paciente') {
        if (!estadoAutenticacion.pacienteConectado) {
          renderizarLoginPaciente();
        } else {
          renderizarPanelPaciente();
        }
      } else {
        if (!estadoAutenticacion.doctorConectado) {
          renderizarLoginDoctor();
        } else {
          if (pacienteSeleccionadoDoctor) {
            renderizarPanelDoctorConPaciente();
          } else {
            renderizarPanelDoctor();
          }
        }
      }
    }

    // ========== COMPONENTE DEL IFRAME DE CHATBASE ==========
    function crearIframeChatbot(altura = '600px') {
      return `
        <div class="contenedor-chatbot" id="contenedorChatbot">
          <div class="cargando-chatbot" id="cargandoChatbot">
            <div class="spinner"></div>
            <p><strong>Cargando Asistente IA...</strong></p>
            <small style="color:#666;">HealthConnect Perú</small>
          </div>
          <iframe
            id="iframeChatbot"
            src="${CONFIG_CHATBASE.iframeUrl}"
            width="100%"
            style="height: 100%; min-height: ${altura}; display: none;"
            frameborder="0"
            allow="microphone"
            title="Asistente Virtual HealthConnect"
            onload="
              document.getElementById('cargandoChatbot').style.display='none';
              document.getElementById('iframeChatbot').style.display='block';
            ">
          </iframe>
        </div>
      `;
    }

    // ========== VISTAS PACIENTE ==========
    
    function renderizarLoginPaciente() {
      const html = `
        <div class="caja-autenticacion">
          <h3 style="color:#0b3d5f;"><i class="fas fa-sign-in-alt"></i> Acceso Paciente</h3>
          <p style="color:#666; font-size:0.9rem;">
            Ingresa con tu correo y código de verificación para acceder al asistente virtual.
          </p>
          <div class="grupo-entrada">
            <label class="etiqueta">Correo electrónico</label>
            <input type="email" id="entradaCorreoPaciente" class="campo-texto" placeholder="ej: juan.perez@gmail.com" value="juan.perez@gmail.com">
          </div>
          <div class="grupo-entrada">
            <label class="etiqueta">Código de verificación (6 dígitos)</label>
            <input type="text" id="entradaCodigoPaciente" class="campo-texto" placeholder="Código enviado a tu correo" maxlength="6">
            <small style="color:#2a9d8f; cursor:pointer;" id="pistaCodigo">🔍 Ver código de demostración</small>
          </div>
          <button class="boton-principal" id="botonLoginPaciente">
            <i class="fas fa-arrow-right"></i> Ingresar al sistema
          </button>
          <div style="background:#f8fafc; padding:1rem; border-radius:1rem; font-size:0.8rem; color:#555;">
            <strong><i class="fas fa-info-circle"></i> Usuarios de demostración:</strong><br>
            • juan.perez@gmail.com (código: 482931)<br>
            • maria.lopez@email.com (código: 759201)<br>
            • carlos.ruiz@salud.pe (código: 104832)
          </div>
        </div>
      `;
      vistaDinamica.innerHTML = html;
      
      document.getElementById('botonLoginPaciente').addEventListener('click', manejarLoginPaciente);
      document.getElementById('pistaCodigo').addEventListener('click', () => {
        const correo = document.getElementById('entradaCorreoPaciente').value.trim();
        if (BASE_PACIENTES[correo]) {
          alert(`Código de demostración para ${correo}: ${BASE_PACIENTES[correo].codigoVerificacion}`);
        } else {
          alert('Ingresa un correo válido de la lista de demostración.');
        }
      });
    }

    function manejarLoginPaciente() {
      const correo = document.getElementById('entradaCorreoPaciente').value.trim();
      const codigo = document.getElementById('entradaCodigoPaciente').value.trim();
      const datosPaciente = BASE_PACIENTES[correo];
      
      if (!datosPaciente) {
        alert('Paciente no encontrado. Usa uno de los correos de demostración.');
        return;
      }
      if (codigo !== datosPaciente.codigoVerificacion) {
        alert('Código incorrecto. Revisa el código de demostración.');
        return;
      }
      
      estadoAutenticacion.pacienteConectado = true;
      estadoAutenticacion.correoPaciente = correo;
      estadoAutenticacion.datosPaciente = datosPaciente;
      pestanaActiva = 'chatbot';
      
      aplicarTransicionDesvanecer();
      renderizarVista();
    }

    function renderizarPanelPaciente() {
      const datosPaciente = estadoAutenticacion.datosPaciente;
      if (!datosPaciente) return;
      
      const html = `
        <div style="display:flex; justify-content: space-between; align-items:center;">
          <h3 style="color:#0b3d5f;"><i class="fas fa-user-check"></i> Bienvenido, ${datosPaciente.nombre}</h3>
          <button class="boton-secundario boton-pequeno" id="botonCerrarSesionPaciente"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
        </div>
        
        <!-- Información del paciente -->
        <div class="info-paciente">
          <p style="margin:0;"><strong>🆔 ID:</strong> ${datosPaciente.id} | <strong>📅 Edad:</strong> ${datosPaciente.edad} años</p>
          <p style="margin:0.2rem 0;"><strong>📋 Diagnóstico:</strong> ${datosPaciente.diagnostico}</p>
          <p style="margin:0.2rem 0;"><strong>💊 Medicamentos:</strong> ${datosPaciente.medicamentos}</p>
          <p style="margin:0.2rem 0;"><strong>⚠️ Alergias:</strong> ${datosPaciente.alergias}</p>
          <p style="margin:0.2rem 0;"><strong>📅 Próxima cita:</strong> ${datosPaciente.proximaCita}</p>
        </div>
        
        <!-- Barra de navegación -->
        <div class="barra-navegacion">
          <button class="pestana ${pestanaActiva === 'chatbot' ? 'activa' : ''}" id="pestanaChatbot">
            <i class="fas fa-robot"></i> Asistente IA
          </button>
          <button class="pestana ${pestanaActiva === 'historial' ? 'activa' : ''}" id="pestanaHistorial">
            <i class="fas fa-history"></i> Mi Historial
          </button>
        </div>
        
        <!-- Contenido dinámico según pestaña -->
        <div id="contenidoPestana">
          ${pestanaActiva === 'chatbot' ? crearIframeChatbot('550px') : crearHistorialPaciente(datosPaciente)}
        </div>
      `;
      
      vistaDinamica.innerHTML = html;
      
      // Event Listeners
      document.getElementById('botonCerrarSesionPaciente').addEventListener('click', cerrarSesionPaciente);
      document.getElementById('pestanaChatbot').addEventListener('click', () => cambiarPestana('chatbot'));
      document.getElementById('pestanaHistorial').addEventListener('click', () => cambiarPestana('historial'));
    }

    function crearHistorialPaciente(datosPaciente) {
      return `
        <div style="background:#f8fafc; border-radius:1rem; padding:1.5rem;">
          <h4 style="color:#0b3d5f; margin-bottom:1rem;">
            <i class="fas fa-clipboard-list"></i> Historial Clínico Completo
          </h4>
          
          <div style="background:white; border-radius:0.8rem; padding:1rem; margin-bottom:0.8rem; border:1px solid #e0e8f0;">
            <strong>📋 Datos del Paciente</strong>
            <p style="margin:0.3rem 0;">Nombre: ${datosPaciente.nombre}</p>
            <p style="margin:0.3rem 0;">Edad: ${datosPaciente.edad} años</p>
            <p style="margin:0.3rem 0;">ID: ${datosPaciente.id}</p>
          </div>
          
          <div style="background:white; border-radius:0.8rem; padding:1rem; margin-bottom:0.8rem; border:1px solid #e0e8f0;">
            <strong>💊 Medicación Actual</strong>
            <p style="margin:0.3rem 0;">${datosPaciente.medicamentos}</p>
          </div>
          
          <div style="background:white; border-radius:0.8rem; padding:1rem; margin-bottom:0.8rem; border:1px solid #e0e8f0;">
            <strong>🔬 Últimos Laboratorios</strong>
            <p style="margin:0.3rem 0;">${datosPaciente.laboratorio}</p>
          </div>
          
          <div style="background:white; border-radius:0.8rem; padding:1rem; margin-bottom:0.8rem; border:1px solid #e0e8f0;">
            <strong>⚠️ Alergias</strong>
            <p style="margin:0.3rem 0;">${datosPaciente.alergias}</p>
          </div>
          
          <div style="background:white; border-radius:0.8rem; padding:1rem; border:1px solid #e0e8f0;">
            <strong>📅 Próxima Cita</strong>
            <p style="margin:0.3rem 0;">${datosPaciente.proximaCita}</p>
          </div>
        </div>
      `;
    }

    function cambiarPestana(nuevaPestana) {
      pestanaActiva = nuevaPestana;
      const datosPaciente = estadoAutenticacion.datosPaciente;
      const contenidoPestana = document.getElementById('contenidoPestana');
      
      if (contenidoPestana && datosPaciente) {
        if (nuevaPestana === 'chatbot') {
          contenidoPestana.innerHTML = crearIframeChatbot('550px');
        } else {
          contenidoPestana.innerHTML = crearHistorialPaciente(datosPaciente);
        }
        
        // Actualizar clases activas en pestañas
        document.querySelectorAll('.pestana').forEach(p => p.classList.remove('activa'));
        document.getElementById(`pestana${nuevaPestana === 'chatbot' ? 'Chatbot' : 'Historial'}`).classList.add('activa');
      }
    }

    function cerrarSesionPaciente() {
      estadoAutenticacion.pacienteConectado = false;
      estadoAutenticacion.correoPaciente = null;
      estadoAutenticacion.datosPaciente = null;
      pestanaActiva = 'chatbot';
      aplicarTransicionDesvanecer();
      renderizarVista();
    }

    function renderizarLoginDoctor() {

            Acceso exclusivo para personal médico de HealthConnect Perú.
          </p>
          <div class="grupo-entrada">
            <label class="etiqueta">Correo institucional</label>
            <input type="email" id="entradaCorreoDoctor" class="campo-texto" placeholder="doctor@healthconnect.pe" value="doctor@healthconnect.pe">
          </div>
          <div class="grupo-entrada">
            <label class="etiqueta">Contraseña</label>
            <input type="password" id="entradaContrasenaDoctor" class="campo-texto" placeholder="••••••••" value="med2026">
          </div>
          <button class="boton-principal" id="botonLoginDoctor"><i class="fas fa-lock-open"></i> Ingresar</button>
          <div style="background:#f8fafc; padding:1rem; border-radius:1rem; font-size:0.8rem; color:#555;">
            <strong><i class="fas fa-info-circle"></i> Credenciales:</strong><br>
            Usuario: doctor@healthconnect.pe<br>
            Contraseña: med2026
          </div>
        </div>
      `;
      vistaDinamica.innerHTML = html;
      
      document.getElementById('botonLoginDoctor').addEventListener('click', () => {
        const correo = document.getElementById('entradaCorreoDoctor').value.trim();
        const contrasena = document.getElementById('entradaContrasenaDoctor').value.trim();
        const datosDoctor = BASE_DOCTORES[correo];
        
        if (datosDoctor && contrasena === datosDoctor.contrasena) {
          estadoAutenticacion.doctorConectado = true;
          estadoAutenticacion.correoDoctor = correo;
          estadoAutenticacion.datosDoctor = datosDoctor;
          pestanaActiva = 'chatbot';
          aplicarTransicionDesvanecer();
          renderizarVista();
        } else {
          alert('Credenciales incorrectas. Usa: doctor@healthconnect.pe / med2026');
        }
      });
    }

    function renderizarPanelDoctor() {
      const datosDoctor = estadoAutenticacion.datosDoctor;
      const pacientes = Object.entries(BASE_PACIENTES);
      let htmlTarjetas = '';
      
      pacientes.forEach(([correo, datos]) => {
        htmlTarjetas += `
          <div class="tarjeta-paciente" data-correo="${correo}">
            <div>
              <strong>${datos.nombre}</strong><br>
              <small>${datos.edad} años · ${datos.diagnostico}</small>
            </div>
            <i class="fas fa-chevron-right" style="color:#2a9d8f;"></i>
          </div>
        `;
      });
      
      const html = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 style="color:#0b3d5f;"><i class="fas fa-procedures"></i> Mis Pacientes</h3>
          <button class="boton-secundario boton-pequeno" id="botonCerrarSesionDoctor"><i class="fas fa-sign-out-alt"></i> Salir</button>
        </div>
        
        <div class="info-doctor">
          <i class="fas fa-user-md"></i> <strong>${datosDoctor.nombre}</strong> · ${datosDoctor.especialidad}

        <p style="font-size:0.85rem; color:#666;">

        <div class="lista-pacientes" id="contenedorListaPacientes">${htmlTarjetas}</div>
      `;
      vistaDinamica.innerHTML = html;
      
      document.querySelectorAll('.tarjeta-paciente').forEach(tarjeta => {
        tarjeta.addEventListener('click', () => {
          pacienteSeleccionadoDoctor = tarjeta.getAttribute('data-correo');
          pestanaActiva = 'chatbot';
          aplicarTransicionDesvanecer();
          renderizarVista();
        });
      });
      
      document.getElementById('botonCerrarSesionDoctor').addEventListener('click', cerrarSesionDoctor);
    }

    function renderizarPanelDoctorConPaciente() {
      const correo = pacienteSeleccionadoDoctor;
      const datosPaciente = BASE_PACIENTES[correo];
      const datosDoctor = estadoAutenticacion.datosDoctor;
      if (!datosPaciente) return;
      
      const html = `
        <div style="display:flex; justify-content:space-between;">
          <button class="boton-secundario boton-pequeno" id="botonVolverPacientes"><i class="fas fa-arrow-left"></i> Volver a lista</button>
          <button class="boton-secundario boton-pequeno" id="botonCerrarSesionDoctorChat"><i class="fas fa-sign-out-alt"></i> Salir</button>
        </div>
        
        <div class="resumen-clinico">
          <strong>📋 ${datosPaciente.nombre} (${datosPaciente.edad} años) · ID: ${datosPaciente.id}</strong><br>
          💊 ${datosPaciente.medicamentos}<br>
          ⚠️ Alergias: ${datosPaciente.alergias}<br>
          🧪 ${datosPaciente.laboratorio}<br>

        <p style="font-size:0.85rem; color:#555;">
          <i class="fas fa-user-md"></i> Atendiendo como: ${datosDoctor.nombre}
        </p>
        
        <!-- Chatbot iframe para el doctor -->
        ${crearIframeChatbot('500px')}
      `;
      vistaDinamica.innerHTML = html;
      
      document.getElementById('botonVolverPacientes').addEventListener('click', () => {
        pacienteSeleccionadoDoctor = null;
        aplicarTransicionDesvanecer();
        renderizarVista();
      });
      
      document.getElementById('botonCerrarSesionDoctorChat').addEventListener('click', cerrarSesionDoctor);

    function cerrarSesionDoctor() {
      estadoAutenticacion.doctorConectado = false;
      estadoAutenticacion.correoDoctor = null;
      estadoAutenticacion.datosDoctor = null;
      pacienteSeleccionadoDoctor = null;

    // ========== INICIALIZACIÓN ==========
    botonesRol.forEach(boton => {
      boton.addEventListener('click', () => {

    renderizarVista();
    
    console.log('🏥 HealthConnect Perú inicializado');
    console.log('🤖 Chatbot iframe se cargará solo después del inicio de sesión');
    console.log('🆔 Agent ID:', CONFIG_CHATBASE.agentId);
  })();
